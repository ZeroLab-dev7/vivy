<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#180b30"/>
            <stop offset="100%" stop-color="#070312"/>
        </linearGradient>
        <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7928ca" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff0080" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <rect width="700" height="250" fill="url(#bgGrad)"/>
    <circle cx="150" cy="80" r="180" fill="url(#orb1)"/>
    <circle cx="550" cy="180" r="160" fill="url(#orb2)"/>
    <!-- Diagonal light stripe -->
    <path d="M-50,250 L300,-50 L380,-50 L30,250 Z" fill="#fff" opacity="0.03"/>
</svg>
