<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
    <rect width="700" height="250" fill="#03080f"/>
    <defs>
        <linearGradient id="techLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <!-- Geometric grid background lines -->
    <line x1="0" y1="50" x2="700" y2="50" stroke="#00f2fe" stroke-width="0.5" opacity="0.1"/>
    <line x1="0" y1="125" x2="700" y2="125" stroke="#00f2fe" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="200" x2="700" y2="200" stroke="#00f2fe" stroke-width="0.5" opacity="0.1"/>
    <line x1="150" y1="0" x2="150" y2="250" stroke="#00f2fe" stroke-width="0.5" opacity="0.1"/>
    <line x1="350" y1="0" x2="350" y2="250" stroke="#00f2fe" stroke-width="0.5" opacity="0.15"/>
    <line x1="550" y1="0" x2="550" y2="250" stroke="#00f2fe" stroke-width="0.5" opacity="0.1"/>
    <!-- Cyber decoration circles -->
    <circle cx="350" cy="125" r="8" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
    <circle cx="350" cy="125" r="3" fill="#00f2fe" opacity="0.8"/>
    <path d="M 310,125 L 260,125" stroke="url(#techLine)" stroke-width="1.5"/>
    <path d="M 390,125 L 440,125" stroke="url(#techLine)" stroke-width="1.5"/>
    <circle cx="150" cy="50" r="3" fill="#00f2fe" opacity="0.5"/>
    <circle cx="550" cy="200" r="3" fill="#00f2fe" opacity="0.5"/>
</svg>
