<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
    <defs>
        <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fd746c"/>
            <stop offset="100%" stop-color="#ff9068"/>
        </linearGradient>
    </defs>
    <rect width="700" height="250" fill="url(#sky)"/>
    <!-- Glowing Sun -->
    <circle cx="350" cy="160" r="65" fill="#fffae0" opacity="0.95"/>
    <!-- Mountain ranges -->
    <polygon points="-50,250 150,100 380,250" fill="#4a154b" opacity="0.7"/>
    <polygon points="300,250 500,80 750,250" fill="#31103f" opacity="0.8"/>
    <polygon points="100,250 350,130 600,250" fill="#1e0b29"/>
    <!-- Water base reflection -->
    <rect y="230" width="700" height="20" fill="#13061c"/>
</svg>
