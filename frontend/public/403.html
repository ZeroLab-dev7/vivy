<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Access Forbidden · Vivy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(10, 15, 30, 0.55);
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.12);
            --cyan: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.25);
            --purple: #9d4edd;
            --amber: #f59e0b;
            --amber-glow: rgba(245, 158, 11, 0.25);
            --red: #ef4444;
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --text-3: #4b5563;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-display: 'Outfit', system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.013) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.013) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            animation: drift 22s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
            top: -150px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -9s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.12) 0%, transparent 70%);
            top: 40%;
            left: 55%;
            animation-delay: -15s;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(45px, -35px) scale(1.06);
            }

            66% {
                transform: translate(-25px, 50px) scale(0.94);
            }
        }

        .error-card {
            position: relative;
            z-index: 10;
            max-width: 560px;
            width: calc(100% - 40px);
            background: var(--bg-card);
            border: 1px solid rgba(245, 158, 11, 0.12);
            border-radius: 24px;
            padding: 56px 48px;
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(245, 158, 11, 0.05);
            text-align: center;
            animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: 0 0 20px var(--cyan-glow);
            padding: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #fff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Shield icon with glow */
        .shield-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .shield-icon {
            width: 80px;
            height: 80px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 34px;
            color: var(--amber);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
            animation: icon-pulse 3s ease-in-out infinite;
        }

        @keyframes icon-pulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
            }

            50% {
                box-shadow: 0 0 50px rgba(245, 158, 11, 0.4);
            }
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(80px, 16vw, 120px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--amber) 0%, var(--red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.35));
            margin-bottom: 8px;
            animation: pulse-amber 3s ease-in-out infinite;
        }

        @keyframes pulse-amber {

            0%,
            100% {
                filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.35));
            }

            50% {
                filter: drop-shadow(0 0 50px rgba(245, 158, 11, 0.6));
            }
        }

        .error-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--amber), var(--red));
            border-radius: 2px;
            margin: 20px auto 24px;
        }

        .error-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .error-message {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-2);
            margin-bottom: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #060b1a;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.12);
            border: 1px solid rgba(88, 101, 242, 0.3);
            color: #8a9eff;
        }

        .btn-discord:hover {
            background: rgba(88, 101, 242, 0.22);
            transform: translateY(-1px);
        }

        .error-hint {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-3);
        }

        .error-hint a {
            color: var(--cyan);
            text-decoration: none;
        }

        .error-hint a:hover {
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 40px 24px;
            }

            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="bg-grid"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="error-card" role="main">

        <a href="/" class="logo" aria-label="Vivy Home">
            <span class="logo-icon"><img src="/logo.png" alt="Vivy Logo"></span>
            <span class="logo-text">Vivy</span>
        </a>

        <div class="shield-wrap">
            <div class="shield-icon" aria-hidden="true">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
        </div>

        <div class="error-code" aria-label="Error 403">403</div>

        <div class="error-divider"></div>

        <h1 class="error-title">Access Forbidden</h1>
        <p class="error-message">
            You don't have permission to access this page.<br>
            This area may require special authorization or your session may have expired.
        </p>

        <div class="btn-row" role="navigation" aria-label="Recovery options">
            <a href="/" class="btn btn-primary" id="btn-home">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
                Return Home
            </a>
            <a href="/auth/discord/login" class="btn btn-secondary" id="btn-login">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                Log In Again
            </a>
            <a href="https://discord.gg/kB2cAM897m" class="btn btn-discord" id="btn-support" target="_blank"
                rel="noopener noreferrer">
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
                Support Server
            </a>
        </div>

        <p class="error-hint">
            Error code: <strong>403</strong> &middot;
            Need help? <a href="https://discord.gg/kB2cAM897m" target="_blank" rel="noopener noreferrer">Join our
                Discord</a>
        </p>

    </main>

</body>

</html>
