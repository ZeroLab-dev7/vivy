<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · Vivy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(10, 15, 30, 0.55);
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.12);
            --cyan: #00f2fe;
            --cyan-dim: rgba(0, 242, 254, 0.08);
            --cyan-glow: rgba(0, 242, 254, 0.25);
            --purple: #9d4edd;
            --purple-dim: rgba(157, 78, 221, 0.08);
            --pink: #f72585;
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --text-3: #4b5563;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-display: 'Outfit', system-ui, sans-serif;
            --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: dark;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.013) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.013) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: grid-breathe 8s ease-in-out infinite;
        }

        @keyframes grid-breathe {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            animation: drift 22s ease-in-out infinite;
        }

        .orb-1 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.18) 0%, transparent 70%);
            top: -200px;
            left: -150px;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.18) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(247, 37, 133, 0.12) 0%, transparent 70%);
            top: 50%;
            left: 45%;
            animation-delay: -14s;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -40px) scale(1.08);
            }

            66% {
                transform: translate(-30px, 55px) scale(0.93);
            }
        }

        /* ── Card ── */
        .error-card {
            position: relative;
            z-index: 10;
            max-width: 560px;
            width: calc(100% - 40px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 48px;
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02);
            text-align: center;
            animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Logo ── */
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: 0 0 20px var(--cyan-glow);
            padding: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #fff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── 404 Number ── */
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(96px, 18vw, 140px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 60%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(0, 242, 254, 0.3));
            margin-bottom: 8px;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                filter: drop-shadow(0 0 40px rgba(0, 242, 254, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 60px rgba(0, 242, 254, 0.55));
            }
        }

        /* ── Divider Line ── */
        .error-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            border-radius: 2px;
            margin: 20px auto 24px;
            animation: expand 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        @keyframes expand {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 60px;
                opacity: 1;
            }
        }

        .error-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .error-message {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-2);
            margin-bottom: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── Buttons ── */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #060b1a;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-hover);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.12);
            border: 1px solid rgba(88, 101, 242, 0.3);
            color: #8a9eff;
        }

        .btn-discord:hover {
            background: rgba(88, 101, 242, 0.22);
            border-color: rgba(88, 101, 242, 0.5);
            transform: translateY(-1px);
        }

        /* ── Footer hint ── */
        .error-hint {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-3);
        }

        .error-hint a {
            color: var(--cyan);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .error-hint a:hover {
            opacity: 0.7;
        }

        /* ── Floating dots ── */
        .float-dots {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.4);
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .error-card {
                padding: 40px 24px;
            }

            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="bg-grid"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Floating particles -->
    <div class="float-dots" id="floatDots"></div>

    <!-- Error Card -->
    <main class="error-card" role="main">

        <!-- Logo -->
        <a href="/" class="logo" aria-label="Vivy Home">
            <span class="logo-icon"><img src="/logo.png" alt="Vivy Logo"></span>
            <span class="logo-text">Vivy</span>
        </a>

        <!-- Code -->
        <div class="error-code" aria-label="Error 404">404</div>

        <!-- Divider -->
        <div class="error-divider"></div>

        <!-- Text -->
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for doesn't exist or may have been moved.<br>
            It might also be restricted to authorized users.
        </p>

        <!-- Actions -->
        <div class="btn-row" role="navigation" aria-label="Recovery options">
            <a href="/" class="btn btn-primary" id="btn-home">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
                Return Home
            </a>
            <a href="/servers" class="btn btn-secondary" id="btn-dashboard">
                <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
                Open Dashboard
            </a>
            <a href="https://discord.gg/kB2cAM897m" class="btn btn-discord" id="btn-support" target="_blank"
                rel="noopener noreferrer">
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
                Support Server
            </a>
        </div>

        <!-- Hint -->
        <p class="error-hint">
            Error code: <strong>404</strong> &middot;
            Need help? <a href="https://discord.gg/kB2cAM897m" target="_blank" rel="noopener noreferrer">Join our
                Discord</a>
        </p>

    </main>

    <script>
        // Spawn floating particles
        const container = document.getElementById('floatDots');
        const count = 18;
        for (let i = 0; i < count; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 4 + 2;
            dot.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 12 + 10}s;
                animation-delay: ${Math.random() * -20}s;
                opacity: ${Math.random() * 0.6 + 0.2};
                background: ${Math.random() > 0.5 ? 'rgba(0,242,254,0.5)' : 'rgba(157,78,221,0.5)'};
            `;
            container.appendChild(dot);
        }
    </script>
</body>

</html>
