<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Server — Vivy</title>
    <meta name="description" content="Choose a Discord server to configure with Vivy.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/selector.DdDdbkC3.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.axk1WA_r.js">
  <link rel="stylesheet" crossorigin href="/assets/dashboard.yS2XszVG.css">
</head>
<body>

    <!-- Grid lines overlay & background orbs -->
    <div class="bg-grid-overlay"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Topbar -->
    <nav class="dash-nav">
        <div class="dash-nav-logo">
            <div class="logo-icon"><img src="/logo.png" alt="Vivy"></div>
            <span class="logo-text">Vivy</span>
        </div>
        <div class="dash-nav-center"></div>
        <div class="dash-nav-right">
            <a href="/developer" class="btn btn-secondary btn-sm" id="devPortalBtn" style="display:none; margin-right:12px; gap:6px; align-items:center;">
                <i class="fa-solid fa-code"></i> Dev Portal
            </a>
            <div class="user-chip" id="userChip">
                <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" id="userAvatar">
                <span id="username">Loading…</span>
            </div>
            <a href="/auth/discord/logout" class="btn-logout" id="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Page -->
    <div class="selector-wrap">
        <!-- Hero -->
        <div class="selector-hero">
            <h1>Select a <span class="gradient-text">Server</span></h1>
            <p>Choose a Discord server where you have Manage Server permission to configure Vivy.</p>
        </div>

        <!-- Installed Servers -->
        <div class="section-title"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Configured Servers</div>
        <div class="section-list" id="installedServers">
            <div class="server-card skeleton" style="height:84px;"></div>
            <div class="server-card skeleton" style="height:84px;"></div>
        </div>

        <!-- Invite Servers -->
        <div class="section-title" style="margin-top:32px;"><i class="fa-solid fa-plus-circle" style="color:var(--purple)"></i> Add to a Server</div>
        <div class="section-list" id="inviteServers">
            <div class="server-card skeleton" style="height:84px;"></div>
            <div class="server-card skeleton" style="height:84px;"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-wrap" id="toastWrap"></div>

</body>
</html>
