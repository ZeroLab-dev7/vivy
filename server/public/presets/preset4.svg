<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
    <rect width="700" height="250" fill="#121214"/>
    <defs>
        <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
        </pattern>
        <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.02"/>
        </linearGradient>
    </defs>
    <rect width="700" height="250" fill="url(#grid)"/>
    <rect width="700" height="250" fill="url(#cardGlow)"/>
    <path d="M-100,0 L350,0 L150,250 L-100,250 Z" fill="#ffffff" opacity="0.01"/>
</svg>
