server {
    server_name vivy.zerolab.best;

    # Disable directory listing
    autoindex off;

    # Custom error pages for Nginx-level errors
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/vivy;
        internal;
    }

    error_page 403 /403.html;
    location = /403.html {
        root /var/www/vivy;
        internal;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/vivy;
        internal;
    }

    # Block access to sensitive files and directories, returning our custom 404 page
    location ~* /\.(git|env) {
        return 404;
    }

    location ~* ^/(node_modules|logs|config)(/|$) {
        return 404;
    }

    location ~* \.(zip|sql|bak|tar|gz|log|env|git)$ {
        return 404;
    }

    location ~* ^/(package\.json|package-lock\.json|tsconfig\.json|config\.js|config\.json)$ {
        return 404;
    }

    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:3030;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vivy.zerolab.best/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vivy.zerolab.best/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = vivy.zerolab.best) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name vivy.zerolab.best;
    listen 80;
    return 404; # managed by Certbot
}
